<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />

    <!-- animate.style -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
      .container {
        border: 1px solid red;
        padding: 15px;
        border-radius: 20px;
      }
      h1 {
        font-size: 65px;
        font-weight: bold;
        text-align: center;
        padding: 5px;
        background: linear-gradient(to right, blue, green);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .card {
        aspect-ratio: 4/3;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.8s;
        background-color: gray;
      }

      .card:hover {
        transform: scale(0.95);
      }

      .card-container {
        display: flex;
      }

      .timer {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 50px;
        background-color: beige;
        margin: auto;
        font-weight: bold;
        border-radius: 10px;
        margin-bottom: 10px;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 25px;
        }

        .timer {
          height: 30px;
          font-size: 14px;
        }
      }
    </style>

    <title>Game Tebak Warna</title>
  </head>
  <body>
    <div class="container">
      <div class="row grid-container g-2">
        <h1>GAME TEBAK WARNA</h1>
        <div class="row justify-content-center text-center">
          <div class="col-10 col-md-4">
            <div class="timer">Sisa waktu Anda : <span class="px-2"> 01 : 20</span></div>
          </div>
        </div>

        <div class="col-4 col-md-2">
          <div class="card" data-warna="merah"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="biru"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="kuning"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="hijau"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="ungu"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="toska"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="merah"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="biru"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="kuning"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="hijau"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="ungu"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="toska"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="hitam"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="fuchisa"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="salmon"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="hitam"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="fuchisa"></div>
        </div>
        <div class="col-4 col-md-2">
          <div class="card" data-warna="salmon"></div>
        </div>
      </div>
    </div>

    <script>
      const cards = document.querySelectorAll(".card");
      const soundBenar = new Audio("sound/benar.mp3");
      const soundSalah = new Audio("sound/salah.mp3");

      // Mengacak posisi kartu
      const cardArray = [...cards];

      cardArray.sort(() => Math.random() - 0.5);

      const row = document.querySelector(".grid-container");

      // Memasukkan kembali kartu sesuai urutan acak
      cardArray.forEach((card) => row.appendChild(card.parentElement));

      // Mengambil kartu yang terbuka
      function getFlippedCards() {
        return cardArray.filter((card) => card.dataset.flipped === "true" && card.dataset.cleared !== "true");
      }

      // Mengambil kartu yang belum ditemukan
      function getRemainingCards() {
        return cardArray.filter((card) => card.dataset.cleared !== "true");
      }

      // Fungsi jeda waktu
      const delay = (ms = 1000) => new Promise((resolve) => setTimeout(resolve, ms));

      // Mengunci klik ketika sedang memeriksa kartu
      let isChecking = false;

      // Fungsi membuka kartu
      async function flipCard(card) {
        // Jika kartu sudah terbuka atau ditemukan, hentikan
        // if (card.dataset.flipped === "true" || card.dataset.cleared === "true") return;

        // Jika sedang memeriksa dua kartu, hentikan
        if (isChecking) return;

        // Membuka kartu
        card.dataset.flipped = "true";

        // Mengambil warna asli dari atribut data-warna
        const warna = {
          merah: "red",
          biru: "rgb(7, 18, 231)",
          kuning: "rgb(231, 212, 7)",
          hijau: "rgb(9, 228, 24)",
          ungu: "rgb(227, 70, 231)",
          toska: "rgb(7, 216, 231)",
          hitam: "rgb(0, 0, 0)",
          fuchisa: "rgb(117,22,22)",
          salmon: "rgb(250, 128, 114)",
        };

        card.style.backgroundColor = warna[card.dataset.warna];
        card.classList.add("animate__animated", "animate__flipInY");

        // Mengambil kartu yang terbuka
        const flippedCards = getFlippedCards();

        // Jika baru satu kartu terbuka, tunggu kartu kedua
        if (flippedCards.length !== 2) return;

        isChecking = true;

        // Mengambil kedua kartu
        const [card1, card2] = flippedCards;

        // Memeriksa apakah warna kedua kartu sama
        if (card1.dataset.warna === card2.dataset.warna) {
          // Animasi ketika kartu cocok
          flippedCards.forEach((card) => {
            card.classList.remove("animate__flipInY");
            card.classList.add("animate__animated", "animate__rubberBand");
            soundBenar.play();
          });
          // Beri jeda sebelum kartu dihilangkan
          await delay();

          // Tandai kartu sudah ditemukan
          flippedCards.forEach((card) => {
            card.dataset.cleared = "true";
            card.dataset.flipped = "false";
            card.style.visibility = "hidden";
          });

          // Periksa apakah semua kartu sudah ditemukan
          if (getRemainingCards().length === 0) {
            await delay(1000);
            alert("Selamat! Anda berhasil menyelesaikan Game. \n Daya ingat anda sangat bagus ❤️");
            location.reload();
            return;
          }
        } else {
          // Animasi ketika kartu tidak cocok
          flippedCards.forEach((card) => {
            card.classList.remove("animate__flipInY");
            card.classList.add("animate__animated", "animate__shakeX");
            soundSalah.play();
          });
          // Beri jeda sebelum kartu ditutup
          await delay();

          // Tutup kembali kedua kartu
          flippedCards.forEach((card) => {
            card.dataset.flipped = "false";
            card.style.backgroundColor = "gray";

            // Hapus kelas animasi
            card.classList.remove("animate__animated", "animate__flipInY", "animate__shakeX");
          });
        }

        // Membuka kembali kesempatan klik
        isChecking = false;
      }

      // Event klik setiap kartu
      cards.forEach((card) => {
        card.addEventListener("click", function () {
          //Timer hanya dimulai satu kali
          if (!timerStarted) {
            timer();
            timerStarted = true;
          }

          flipCard(card);
        });
      });

      //timer
      let timerStarted = false;
      function timer() {
        let timeLeft = 1 * 80;
        const countDown = setInterval(() => {
          let minute = Math.floor(timeLeft / 60);
          if (minute < 10) minute = "0" + minute;
          let second = timeLeft % 60;
          if (second < 10) second = "0" + second;

          const timerEl = document.querySelector("span");
          timerEl.innerHTML = `${minute} : ${second}`;

          if (timeLeft === 0) {
            clearInterval(countDown);
            alert("Waktu Anda sudah Habis \n Coba lagi!!");
            location.reload();
            return;
          }

          timeLeft--;
        }, 1000);
      }
    </script>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
  </body>
</html>
